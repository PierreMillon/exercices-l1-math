<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
<title>Python appliqué — Exercices type examen</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<script defer src="vendor/katex/katex.min.js"></script>
<script defer src="vendor/katex/auto-render.min.js"></script>
</head>
<body>
<div class="wrap">

  <header class="ex-header">
    <h1>Python appliqué</h1>
    <a class="ex-back plain" href="index.html">← Exercices</a>
  </header>

  <p class="ex-intro">1 à 2h maximum par semaine : un seul script court qui
    relie une notion du cours à une application concrète. Volontairement
    limité pour ne pas empiéter sur le temps de révision des fondamentaux
    — la régularité prime sur l'exhaustivité.</p>

  <main id="weeklyContainer"></main>

</div>
<script src="katex-typeset.js"></script>
<script src="data/python-applique.js"></script>
<script>
  // Échappement pour le seul bloc inséré tel quel dans le HTML sans être
  // du HTML : le code source Python (peut contenir <, >, & — ex.
  // comparaisons, imports). Le reste (notion, description) est déjà en
  // HTML simple de confiance, comme partout ailleurs sur le site.
  function escapeHtml(s){
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  document.addEventListener('DOMContentLoaded', function(){
    const container = document.getElementById('weeklyContainer');
    container.innerHTML = WEEKLY_PYTHON.map((entry, i) => `
      <section class="${i === 0 ? 'python-card' : 'exemple'}">
        <div class="bloc-label">${i === 0 ? 'Cette semaine — ' : ''}${entry.semaine}</div>
        <h2>${entry.titre} (${entry.duree})</h2>
        <p><em>Notion : ${entry.notion}</em></p>
        <p>${entry.description}</p>
        <pre><code>${escapeHtml(entry.code)}</code></pre>
      </section>
    `).join('');
    typesetMath(container);
  });
</script>
</body>
</html>
